<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Gamer</title>
    <!-- Bootstrap CDN (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

    <div class="container my-5">
        <!-- Rejilla de productos -->
        <div class="row g-4">
            
            <!-- Producto 1: Mouse RGB -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 text-center shadow-sm p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title fw-bold text-dark">Mouse RGB</h5>
                        <p class="card-text text-success fw-bold fs-4 my-2">$45.00</p>
                        <button type="button" class="btn btn-outline-secondary w-100">Comprar</button>
                    </div>
                </div>
            </div>

            <!-- Producto 2: Teclado Meca -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 text-center shadow-sm p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title fw-bold text-dark">Teclado Meca</h5>
                        <p class="card-text text-success fw-bold fs-4 my-2">$85.00</p>
                        <button type="button" class="btn btn-outline-secondary w-100">Comprar</button>
                    </div>
                </div>
            </div>

            <!-- Producto 3: Headset 7.1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 text-center shadow-sm p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title fw-bold text-dark">Headset 7.1</h5>
                        <p class="card-text text-success fw-bold fs-4 my-2">$60.00</p>
                        <button type="button" class="btn btn-outline-secondary w-100">Comprar</button>
                    </div>
                </div>
            </div>

            <!-- Producto 4: Silla Gamer -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 text-center shadow-sm p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title fw-bold text-dark">Silla Gamer</h5>
                        <p class="card-text text-success fw-bold fs-4 my-2">$199.00</p>
                        <button type="button" class="btn btn-outline-secondary w-100">Comprar</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap CDN (JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
